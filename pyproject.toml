[project]
name = "payload2rdf"
version = "0.1.0"
description = ""
authors = [
    {name = "FabioKn",email = "fabio.knoess@t-online.de"},
    {name = "Natanael Arndt",email = "arndtn@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "warcio (>=1.7.5,<2.0.0)",
    "extruct (>=0.18.0,<0.19.0)",
    "click (>=8.2.0,<9.0.0)",
    "rdflib (>=7.1.4,<8.0.0)",
    "w3lib (>=2.3.1,<3.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "beautifulsoup4 (>=4.13.4,<5.0.0)",
    "loguru (>=0.7.3,<0.8.0)"
]

[tool.poetry]
packages = [{include = "payload2rdf"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.scripts]
payload2rdf = "payload2rdf.cli:cli"


[dependency-groups]
s3 = [
    "s3fs (>=2026.7.0,<2027.0.0)"
]
dev = [
    "ruff (>=0.16.6,<0.17.0)"
]

[tool.poetry.group.s3]
optional = true